<div class="login-container">
  <h1>Iniciar sesión</h1>

  <form (ngSubmit)="onSubmit()">
    <label for="email">Correo electrónico</label>
    <input id="email" type="email" name="email" [(ngModel)]="email" required />

    <label for="password">Contraseña</label>
    <input id="password" type="password" name="password" [(ngModel)]="password" required />

    <label class="checkbox-label">
      <input type="checkbox" name="loginAsAdmin" [(ngModel)]="loginAsAdmin" />
      Iniciar sesión como administrador
    </label>

    <button type="submit">Iniciar sesión</button>
  </form>

  <p class="note">Nota: esto será reemplazado por el login de AWS Cognito.</p>
</div>
