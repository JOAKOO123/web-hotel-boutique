<div class="login-container">
  <h1>Log in</h1>

  <form (ngSubmit)="onSubmit()">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" [(ngModel)]="email" required />

    <label for="password">Password</label>
    <input id="password" type="password" name="password" [(ngModel)]="password" required />

    <label class="checkbox-label">
      <input type="checkbox" name="loginAsAdmin" [(ngModel)]="loginAsAdmin" />
      Log in as admin
    </label>

    <button type="submit">Log in</button>
  </form>

  <p class="note">Note: this will be replaced by AWS Cognito login (role via Cognito groups).</p>
</div>
