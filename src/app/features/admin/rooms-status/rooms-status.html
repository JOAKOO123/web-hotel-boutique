<div class="rooms-status">
  <h1>Habitaciones</h1>

  <div class="rooms-grid">
    @for (room of rooms; track room.id) {
      <article class="room-card">
        <img [src]="getImage(room)" [alt]="room.nombre" />
        <div class="room-info">
          <h3>{{ room.nombre }} — {{ typeLabels[room.tipo] }}</h3>
          <span class="status" [class]="getStatus(room.id)">{{ statusLabels[getStatus(room.id)] }}</span>
        </div>
      </article>
    }
  </div>
</div>
