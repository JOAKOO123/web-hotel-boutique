<div class="my-reservations">
  <div class="header-row">
    <h1>Mis reservas</h1>
    <a routerLink="/reservations/new" class="btn-new">+ Nueva reserva</a>
  </div>

  <table class="reservations-table">
    <thead>
      <tr><th>Habitación</th><th>Entrada</th><th>Salida</th><th>Estado</th></tr>
    </thead>
    <tbody>
      @for (reservation of reservations; track reservation.id) {
        <tr>
          <td>{{ reservation.roomNumber }}</td>
          <td>{{ reservation.checkInDate }}</td>
          <td>{{ reservation.checkOutDate }}</td>
          <td><span class="status" [class]="reservation.status">{{ statusLabels[reservation.status] }}</span></td>
        </tr>
      } @empty {
        <tr><td colspan="4">Todavía no has hecho ninguna reserva.</td></tr>
      }
    </tbody>
  </table>
</div>
