<header class="app-header">
	<div class="brand">Hotel Boutique</div>

	<nav class="nav-links">
		<a routerLink="/reservations" routerLinkActive="active">Reservations</a>
	</nav>

	<div class="auth-actions">
		@if (auth.isAuthenticated()) {
			<button class="btn-logout" (click)="onLogout()">Log out</button>
		} @else {
			<a routerLink="/login" class="btn-login">Log in</a>
		}
	</div>
</header>
